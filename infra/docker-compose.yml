services:
  postgres:
    image: postgres:16-alpine
    container_name: artemis-united-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: artemis
      POSTGRES_PASSWORD: artemis
      POSTGRES_DB: artemis_united
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artemis -d artemis_united"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
