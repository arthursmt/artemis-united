name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artemis
          POSTGRES_PASSWORD: artemis
          POSTGRES_DB: artemis_united
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artemis -d artemis_united"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://artemis:artemis@localhost:5432/artemis_united
      INTERNAL_SECRET: ci-internal-secret
      BOB_ENGINE_URL: http://localhost:4100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx turbo run lint

      - name: Typecheck
        run: npx turbo run typecheck

      - name: Migrate database
        run: |
          npm run db:migrate --workspace=apps/api
          npm run db:migrate --workspace=services/bob-engine

      - name: Build
        run: npx turbo run build

      - name: Start bob-engine
        run: |
          node services/bob-engine/dist/index.js > bob-engine.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4100/health > /dev/null && exit 0
            sleep 1
          done
          echo "bob-engine did not become healthy in time" >&2
          cat bob-engine.log
          exit 1

      - name: Test
        run: npx turbo run test
